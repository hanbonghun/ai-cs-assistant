<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오류 — AI CS Assistant</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <style>
        .error-wrap { max-width: 520px; margin: 15vh auto; padding: 0 24px; text-align: center; }
        .error-code { font-size: 56px; font-weight: 700; color: #94a3b8; margin: 0; }
        .error-msg  { font-size: 17px; color: #334155; margin: 12px 0 28px; line-height: 1.6; }
        .error-links a { display: inline-block; margin: 0 8px; color: #2563eb; text-decoration: none; }
        .error-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="error-wrap">
    <p class="error-code" th:text="${status} ?: '오류'">500</p>
    <p class="error-msg" th:switch="${status}">
        <span th:case="404">요청한 페이지를 찾을 수 없습니다.</span>
        <span th:case="*">처리 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</span>
    </p>
    <div class="error-links">
        <a th:href="@{/app}">고객 포털</a>
        <a th:href="@{/ui/inquiries}">상담사 화면</a>
    </div>
</div>
</body>
</html>
