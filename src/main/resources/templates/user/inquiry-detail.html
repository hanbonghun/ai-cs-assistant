<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 상세</title>
    <link rel="stylesheet" href="/app.css">
    <style>
        .status-banner { border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; font-size: 14px; display: flex; align-items: center; gap: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 16px; height: 16px; border: 2px solid #90caf9; border-top-color: #1565c0; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
        .banner-pending  { background: #fff3e0; border: 1px solid #ffcc80; color: #e65100; }
        .banner-answered { background: #e8f5e9; border: 1px solid #a5d6a7; color: #2e7d32; }
        .banner-reviewing{ background: #e3f2fd; border: 1px solid #90caf9; color: #1565c0; }
        .banner-closed   { background: #f5f5f5; border: 1px solid #e0e0e0; color: #757575; }

        .meta-row { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: #888; margin-bottom: 20px; }
        .meta-row span strong { color: #333; }

        .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 20px 24px; margin-bottom: 16px; }
        .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }

        /* 대화 스레드 */
        .thread { display: flex; flex-direction: column; gap: 12px; }
        .bubble-wrap { display: flex; gap: 10px; align-items: flex-start; }
        .bubble-wrap.ai { flex-direction: row-reverse; }
        .bubble-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
        .bubble-avatar.customer { background: #e0e0e0; color: #555; }
        .bubble-avatar.ai-av { background: #1976d2; color: #fff; }
        .bubble { padding: 10px 14px; font-size: 14px; line-height: 1.6; max-width: 80%; white-space: pre-wrap; }
        .bubble.customer-bubble { background: #f5f5f5; border-radius: 12px 12px 12px 2px; }
        .bubble.ai-bubble { background: #e3f2fd; border-radius: 12px 12px 2px 12px; }

        /* 상담사 확정 답변 버블 — AI 자동 답변과 시각적으로 구분 */
        .bubble-avatar.counselor-av { background: #2e7d32; color: #fff; }
        .bubble.counselor-bubble { background: #e8f5e9; border-radius: 12px 12px 2px 12px; }

        /* 대화 종료 라인 — 메신저 "오늘", "어제" 같은 separator 톤 */
        .chat-end {
            margin-top: 18px; padding: 6px 0;
            text-align: center; font-size: 12px; color: #aaa;
            display: flex; align-items: center; gap: 12px;
        }
        .chat-end::before, .chat-end::after {
            content: ''; flex: 1; height: 1px; background: #e0e0e0;
        }

        /* 비동기 대기 상태 시스템 안내 (typing과 달리 정적) */
        .system-notice {
            margin-top: 16px; padding: 10px 14px;
            background: #f5f7fa; border: 1px dashed #cfd8dc; border-radius: 8px;
            font-size: 13px; color: #607d8b;
            display: flex; align-items: center; gap: 8px;
        }
        .system-notice::before { content: '⏳'; font-size: 14px; }

        /* AI 입력 중 (메신저 스타일 typing indicator) */
        .bubble.typing { display: inline-flex; gap: 5px; align-items: center; padding: 12px 16px; }
        .bubble.typing .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #1976d2; opacity: 0.4;
            animation: typing-bounce 1.4s infinite ease-in-out;
        }
        .bubble.typing .dot:nth-child(2) { animation-delay: 0.15s; }
        .bubble.typing .dot:nth-child(3) { animation-delay: 0.30s; }
        @keyframes typing-bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* 답변 입력 */
        .reply-box { border-top: 1px solid #e0e0e0; padding-top: 16px; margin-top: 4px; }
        .reply-box textarea { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid #90caf9;
            border-radius: 6px; font-size: 14px; font-family: inherit; resize: vertical; }
        .reply-box textarea:focus { outline: none; border-color: #1976d2; }
    </style>
</head>
<body>
<div th:insert="~{fragments/topnav :: topnav('user')}"></div>
<main class="page" style="max-width: 680px; margin-top: 52px;">
    <header class="page-header">
        <div>
            <p class="eyebrow">고객 센터</p>
            <h1 th:text="${inquiry.title}">문의 제목</h1>
        </div>
        <a class="button ghost" th:href="@{/app/home}">내 문의 목록</a>
    </header>

    <!-- 모든 상태를 스레드 내부의 채팅 요소로 표현 (상단 배너 없음):
         NEW         → AI typing 버블
         AI_PROCESSED → 상담사 typing 버블
         PENDING_CUSTOMER → AI 추가 질문 버블 + 답변 입력
         AUTO_ANSWERED / REVIEWED / CLOSED → 결과 버블 + chat-end 라인 -->


    <!-- 문의 정보 -->
    <div class="meta-row">
        <span>접수일: <strong th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}">-</strong></span>
        <span th:if="${inquiry.category != null}">유형: <strong th:text="${categoryLabels[inquiry.category.name()] ?: inquiry.category.name()}">-</strong></span>
        <span th:if="${inquiry.relatedOrderId != null}">주문번호: <strong th:text="${inquiry.relatedOrderId}">-</strong></span>
    </div>

    <!-- 대화 스레드 -->
    <div class="card">
        <h2>문의 내용 및 답변</h2>
        <div class="thread">
            <!-- 최초 문의 -->
            <div class="bubble-wrap">
                <div class="bubble-avatar customer" th:text="${#strings.substring(user.name, 0, 1)}">김</div>
                <div class="bubble customer-bubble" th:text="${inquiry.content}">문의 내용</div>
            </div>
            <!-- 이후 메시지 -->
            <div th:each="msg : ${messages}" th:with="s=${inquiry.status.name()}">
                <!-- AI 메시지: 추가 질문(PENDING_CUSTOMER) 또는 자동 처리(AUTO_ANSWERED)일 때만 표시
                     AI_PROCESSED는 어드민 검토 전 초안이므로 유저에게 숨김 -->
                <div th:if="${msg.getRole().name() == 'AI' and
                             (s == 'PENDING_CUSTOMER' or s == 'AUTO_ANSWERED')}"
                     class="bubble-wrap ai">
                    <div class="bubble-avatar ai-av">AI</div>
                    <div class="bubble ai-bubble" th:text="${msg.getContent()}"></div>
                </div>
                <!-- 고객 추가 답변 -->
                <div th:if="${msg.getRole().name() == 'CUSTOMER'}" class="bubble-wrap">
                    <div class="bubble-avatar customer" th:text="${#strings.substring(user.name, 0, 1)}">김</div>
                    <div class="bubble customer-bubble" th:text="${msg.getContent()}"></div>
                </div>
            </div>

            <!-- AI 입력 중: 최초 분석(NEW) 시 서버 사이드로, 재분석 시 JS로 동적 추가 -->
            <div th:if="${inquiry.status.name() == 'NEW'}" class="bubble-wrap ai">
                <div class="bubble-avatar ai-av">AI</div>
                <div class="bubble ai-bubble typing">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>
            </div>

            <!-- 상담사 검토 대기 (비동기 — typing 애니메이션은 실시간 응답 오해를 유발하므로 사용하지 않음) -->
            <div th:if="${inquiry.status.name() == 'AI_PROCESSED'}" class="system-notice">
                상담사가 확인 후 답변드릴 예정입니다.
            </div>

            <!-- 상담사 확정 답변 (REVIEWED / CLOSED) — 채팅 UX 일관성을 위해 버블로 표시 -->
            <div th:if="${inquiry.status.name() == 'REVIEWED' or inquiry.status.name() == 'CLOSED'}"
                 class="bubble-wrap ai">
                <div class="bubble-avatar counselor-av">상담</div>
                <div class="bubble counselor-bubble" th:text="${inquiry.finalAnswer}"></div>
            </div>

            <!-- 대화 종료 라인: AI 자동 답변 또는 상담사 확정 후 -->
            <div th:if="${inquiry.status.name() == 'AUTO_ANSWERED'
                       or inquiry.status.name() == 'REVIEWED'
                       or inquiry.status.name() == 'CLOSED'}"
                 class="chat-end">
                <span th:if="${inquiry.status.name() == 'AUTO_ANSWERED'}">대화가 종료되었습니다</span>
                <span th:if="${inquiry.status.name() == 'REVIEWED'}">상담사 답변으로 종료되었습니다</span>
                <span th:if="${inquiry.status.name() == 'CLOSED'}">종료된 문의입니다</span>
            </div>
        </div>

        <!-- PENDING_CUSTOMER: 고객 답변 입력 -->
        <div th:if="${inquiry.status.name() == 'PENDING_CUSTOMER'}" class="reply-box" id="reply-box">
            <textarea id="reply-input" rows="4" placeholder="추가 내용을 입력해 주세요..."></textarea>
            <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
                <button type="button" class="button" onclick="sendReply()">답변 보내기</button>
                <span id="reply-error" style="font-size:13px;color:#e53935;display:none;"></span>
            </div>
        </div>

    </div>
</main>

<script th:inline="javascript">
    const inquiryId = /*[[${inquiry.id}]]*/ 0;
    const inquiryStatus = /*[[${inquiry.status.name()}]]*/ '';

    // typing 상태(NEW: AI 분석 중 / AI_PROCESSED: 상담사 검토 중)에서 상태 변화 폴링
    if (inquiryStatus === 'NEW' || inquiryStatus === 'AI_PROCESSED') {
        const initialStatus = inquiryStatus;
        const poll = setInterval(async () => {
            try {
                const res = await fetch(`/api/inquiries/${inquiryId}`);
                if (!res.ok) return;
                const data = await res.json();
                if (data.status !== initialStatus) {
                    clearInterval(poll);
                    window.location.reload();
                }
            } catch (e) { /* 무시 */ }
        }, 5000);
    }

    const userName = /*[[${user.name}]]*/ '나';
    const userInitial = userName.charAt(0);

    async function sendReply() {
        const content = document.getElementById('reply-input')?.value?.trim();
        if (!content) { showError('내용을 입력해 주세요.'); return; }
        const btn = document.querySelector('button[onclick="sendReply()"]');
        btn.disabled = true;
        btn.textContent = '전송 중...';
        try {
            const res = await fetch(`/api/inquiries/${inquiryId}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content })
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw new Error(err.message || '전송에 실패했습니다.');
            }

            // 입력한 메시지를 즉시 버블로 추가
            const thread = document.querySelector('.thread');
            const bubble = document.createElement('div');
            bubble.className = 'bubble-wrap';
            bubble.innerHTML = `
                <div class="bubble-avatar customer">${userInitial}</div>
                <div class="bubble customer-bubble" style="white-space:pre-wrap;">${escapeHtml(content)}</div>`;
            thread.appendChild(bubble);

            // 입력창 숨기고 AI typing 버블을 스레드 끝에 추가
            document.getElementById('reply-box').style.display = 'none';
            const typing = document.createElement('div');
            typing.className = 'bubble-wrap ai';
            typing.innerHTML = `
                <div class="bubble-avatar ai-av">AI</div>
                <div class="bubble ai-bubble typing">
                    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                </div>`;
            thread.appendChild(typing);

            // 폴링: 상태 변경 시 페이지 갱신
            const poll = setInterval(async () => {
                try {
                    const r = await fetch(`/api/inquiries/${inquiryId}`);
                    if (!r.ok) return;
                    const data = await r.json();
                    if (data.status !== 'PENDING_CUSTOMER') {
                        clearInterval(poll);
                        window.location.reload();
                    }
                } catch (e) { /* 무시 */ }
            }, 3000);

        } catch (e) {
            showError(e.message);
            btn.disabled = false;
            btn.textContent = '답변 보내기';
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function showError(msg) {
        const el = document.getElementById('reply-error');
        el.textContent = msg;
        el.style.display = 'inline';
        setTimeout(() => el.style.display = 'none', 4000);
    }
</script>
</body>
</html>
