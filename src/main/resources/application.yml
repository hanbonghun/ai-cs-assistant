server:
  port: ${PORT:8080}

spring:
  main:
    lazy-initialization: true
  mvc:
    hiddenmethod:
      filter:
        enabled: true
    async:
      request-timeout: -1

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  ai:
    provider: openai
    model: gpt-4.1-mini
    api-key: ${OPENAI_API_KEY}
    embedding-model: text-embedding-3-small
  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
  langfuse:
    enabled: ${LANGFUSE_ENABLED:true}
    # LANGFUSE_HOST는 deprecated. LANGFUSE_BASE_URL 사용 권장 — 점진적 마이그레이션 위해 둘 다 인식.
    host: ${LANGFUSE_BASE_URL:${LANGFUSE_HOST:https://jp.cloud.langfuse.com}}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    service-name: ai-cs-assistant
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/aicsassistant}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # 512MB 컨테이너에서 커넥션 10개는 과하다. 데모 트래픽은 사실상 단일 사용자다.
      maximum-pool-size: 5
      minimum-idle: 1
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: none
server:
  tomcat:
    threads:
      # 기본 200개는 동시 요청 200개를 받는 서버를 가정한 값이다. 스레드당 스택이 붙으므로
      # 512MB 에서는 상한 자체를 낮춘다.
      max: 20
      min-spare: 2
