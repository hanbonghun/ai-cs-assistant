# PR 과 main push 마다 ./gradlew test 를 돌린다.
# 실측 평가(liveEval·liveCalibrate·liveRescore)는 API 비용이 들어 test 태스크에서 빠져 있다 — 여기서도 돌지 않는다.
# 통합 테스트는 Testcontainers 로 pgvector 컨테이너를 띄운다. ubuntu 러너에는 Docker 가 기본으로 있다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
