plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.12'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aicsassistant'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.12"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'com.pgvector:pgvector:0.1.6'
    implementation 'org.apache.pdfbox:pdfbox:3.0.3'
    implementation platform('io.opentelemetry:opentelemetry-bom:1.46.0')
    implementation 'io.opentelemetry:opentelemetry-api'
    implementation 'io.opentelemetry:opentelemetry-sdk'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.semconv:opentelemetry-semconv:1.30.0-rc.1'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
}

tasks.named('test') {
    // 실측 평가·보정은 API 비용이 든다 — 기본 빌드에서 빼고 liveEval · liveCalibrate 로만 돌린다 (ADR 0010)
    useJUnitPlatform {
        excludeTags 'live-eval', 'live-calibration', 'live-rescore'
    }
}

// 실제 OpenAI 를 부르는 테스트 태스크. 키는 환경변수나 git 추적 밖의 .env 에서 읽는다.
def liveTestTask = { String name, String tag, String desc ->
    tasks.register(name, Test) {
        description = desc
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tag
        }
        def dotenv = file('.env')
        if (!System.getenv('OPENAI_API_KEY') && dotenv.exists()) {
            dotenv.readLines().findAll { it ==~ /^\s*OPENAI_API_KEY\s*=.+/ }.each {
                environment 'OPENAI_API_KEY', it.split('=', 2)[1].trim()
            }
        }
        systemProperty 'liveEval.ids', findProperty('ids') ?: ''
        systemProperty 'liveEval.judge', findProperty('judge') ?: 'true'
        systemProperty 'liveEval.label', findProperty('label') ?: ''
        systemProperty 'liveEval.labels', findProperty('labels') ?: ''
        outputs.upToDateWhen { false }
        testLogging {
            showStandardStreams = true
        }
    }
}

// 50건 평가셋. 일부만: ./gradlew liveEval -Pids=S01,P01   judge 끄기: -Pjudge=false
liveTestTask('liveEval', 'live-eval', 'Runs the live RAG evaluation set against real OpenAI models (costs money).')
// vector 임계값 보정. 임베딩만 부른다.
liveTestTask('liveCalibrate', 'live-calibration', 'Measures real embedding similarity distribution for threshold calibration.')
// 저장된 실행을 현재 채점기로 다시 매긴다. 모델·DB 를 쓰지 않는다. 라벨: -Plabels=20261112-062310=기준선,...
liveTestTask('liveRescore', 'live-rescore', 'Rescores saved live-eval runs with the current scorer (no API calls).')
